name: Documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'context7.json'
      - 'ui/src/lib/docs/articles.json'
      - 'scripts/*docs*.mjs'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'context7.json'
      - 'ui/src/lib/docs/articles.json'
      - 'scripts/*docs*.mjs'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check documentation generators
        run: |
          node --check scripts/sync_docs_handbook.mjs
          node --check scripts/sync_docs_api.mjs
          node --check scripts/check_docs.mjs
      - name: Check navigation, links, API contracts, and generated content
        run: node scripts/check_docs.mjs
